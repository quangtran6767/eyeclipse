name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-eng \
            libgtk-3-dev libappindicator3-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  build-linux-x86_64:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libtesseract-dev libleptonica-dev tesseract-ocr \
            libgtk-3-dev libappindicator3-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/eyeclipse dist/
          tar -czf eyeclipse-linux-x86_64.tar.gz -C dist eyeclipse

      - uses: actions/upload-artifact@v4
        with:
          name: eyeclipse-linux-x86_64
          path: eyeclipse-linux-x86_64.tar.gz

  build-macos-x86_64:
    name: Build macOS x86_64
    needs: test
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install tesseract leptonica

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --no-default-features --features ocr

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/eyeclipse dist/
          tar -czf eyeclipse-macos-x86_64.tar.gz -C dist eyeclipse

      - uses: actions/upload-artifact@v4
        with:
          name: eyeclipse-macos-x86_64
          path: eyeclipse-macos-x86_64.tar.gz

  build-macos-aarch64:
    name: Build macOS aarch64 (Apple Silicon)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install tesseract leptonica

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --no-default-features --features ocr

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/eyeclipse dist/
          tar -czf eyeclipse-macos-aarch64.tar.gz -C dist eyeclipse

      - uses: actions/upload-artifact@v4
        with:
          name: eyeclipse-macos-aarch64
          path: eyeclipse-macos-aarch64.tar.gz

  release:
    name: Create Release
    needs: [build-linux-x86_64, build-macos-x86_64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/eyeclipse-linux-x86_64/eyeclipse-linux-x86_64.tar.gz
            artifacts/eyeclipse-macos-x86_64/eyeclipse-macos-x86_64.tar.gz
            artifacts/eyeclipse-macos-aarch64/eyeclipse-macos-aarch64.tar.gz
