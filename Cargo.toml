[package]
name = "eyeclipse"
version = "0.1.0"
edition = "2021"
description = "Screen region OCR + translation utility"

[features]
default = ["tray", "ocr"]
tray = ["dep:tray-icon", "dep:muda"]
ocr = ["dep:leptess"]

[dependencies]
# Screen capture
xcap = "0.0.14"

# Global hotkey
global-hotkey = "0.6"

# OCR (optional — requires libtesseract-dev + libleptonica-dev)
leptess = { version = "0.14", optional = true }

# UI
eframe = "0.29"
egui = "0.29"

# System tray (optional)
tray-icon = { version = "0.19", optional = true }
muda = { version = "0.15", optional = true }

# Async / HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Image processing
image = "0.25"

# Utilities
anyhow = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
arboard = "3"
png = "0.17"

# GTK (required by tray-icon on Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.20"

[dev-dependencies]
mockito = "1"
tempfile = "3"
